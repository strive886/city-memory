<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 记忆讲述人 · 城市记忆盲盒</title>
<link rel="stylesheet" href="css/style.css">
<style>
.objhead{display:flex;align-items:center;gap:12px}
.objhead .thumb{
  width:60px;height:60px;border-radius:14px;border:1.5px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:31px;flex:0 0 auto;
}
.storybox{border:1.5px solid var(--ink);border-radius:var(--r-md);padding:14px 15px;background:#fdf8ec}
.storybox .hd{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.storybox .hd .who{font-size:11px;color:var(--seal);border:1px solid var(--seal);border-radius:999px;padding:2px 9px;letter-spacing:1px}
.storybox .hd .kb{font-size:10.5px;color:var(--ink-3)}
.storytext{font-family:var(--serif);font-size:14.5px;line-height:2;min-height:84px;color:var(--ink)}
.storytext .caret{display:inline-block;width:2px;height:14px;background:var(--seal);vertical-align:-2px;animation:pulse .8s infinite}
.storyfoot{display:flex;align-items:center;gap:10px;border-top:1px dashed var(--line);margin-top:11px;padding-top:10px}
.playbtn{
  width:34px;height:34px;border-radius:50%;border:1.5px solid var(--ink);background:var(--ink);color:var(--card);
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;flex:0 0 auto;
}
.playbtn.playing{background:var(--seal);border-color:var(--seal)}
.wave{display:flex;gap:2.5px;align-items:center;height:16px}
.wave i{width:2.5px;background:var(--seal);border-radius:2px;height:4px}
.wave.on i{animation:wv .9s ease-in-out infinite}
.wave.on i:nth-child(2){animation-delay:.12s}.wave.on i:nth-child(3){animation-delay:.24s}
.wave.on i:nth-child(4){animation-delay:.36s}.wave.on i:nth-child(5){animation-delay:.48s}
@keyframes wv{0%,100%{height:4px}50%{height:15px}}
.chat{display:flex;flex-direction:column;gap:10px;max-height:230px;overflow-y:auto;padding:2px}
.bub{border:1.5px solid var(--ink);border-radius:14px;padding:10px 13px;font-size:13.5px;line-height:1.85;max-width:86%;background:var(--card)}
.bub.ai{border-radius:14px 14px 14px 4px;align-self:flex-start}
.bub.me{border-radius:14px 14px 4px 14px;align-self:flex-end;background:#efe6d2;border-color:#b9ad95}
.bub.typing i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ink-3);margin-right:4px;animation:pulse .9s infinite}
.bub.typing i:nth-child(2){animation-delay:.15s}.bub.typing i:nth-child(3){animation-delay:.3s}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.quick .chip{cursor:pointer}
.quick .chip:hover{border-color:var(--seal);color:var(--seal)}
.inputrow{display:flex;gap:8px}
.inputrow .field{flex:1;height:44px;border-radius:999px}
.inputrow .send{
  border:none;background:var(--ink);color:var(--card);border-radius:14px;padding:0 17px;
  font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;
}
.inputrow .send:active{transform:scale(.96)}
.footbtns{display:flex;gap:10px}
.footbtns .btn{flex:1;padding:11px 0;font-size:13.5px}
</style>
</head>
<body>
<div class="page-tag"><b>05</b>&nbsp;AI 故事与对话页 · CHAT</div>
<div class="phone">
  <div class="topbar">
    <a class="back" href="03-home.html">←</a>
    <div class="title">AI 记忆讲述人</div>
    <div class="spacer"></div>
    <span class="chip ghost">TTS 语音</span>
  </div>

  <div class="objhead">
    <div class="thumb" id="objThumb">🎫</div>
    <div style="flex:1;min-width:0">
      <div style="font-size:15.5px;font-weight:700;font-family:var(--serif);letter-spacing:1px" id="objName">—</div>
      <div style="font-size:11.5px;color:var(--ink-3)" id="objMeta">—</div>
    </div>
    <span class="chip seal" id="objCity">—</span>
  </div>

  <div class="storybox">
    <div class="hd"><span class="who">AI 生成 · 约80字</span><div class="spacer"></div><span class="kb" id="kbChip">知识库支撑 · 有据可查</span></div>
    <div class="storytext" id="storyText"></div>
    <div class="storyfoot">
      <button class="playbtn" id="ttsBtn" type="button" title="播放语音">▶</button>
      <div class="wave" id="wave"><i></i><i></i><i></i><i></i><i></i></div>
      <span style="font-size:12px;color:var(--ink-2)" id="ttsLabel">播放语音（浏览器 TTS）</span>
      <div class="spacer"></div>
      <span style="font-size:10.5px;color:var(--ink-3)" id="ttsState"></span>
    </div>
  </div>

  <div class="divider">多轮对话 · 想问就问</div>

  <div class="chat" id="chat"></div>

  <div class="quick" id="quick">
    <span class="chip ghost">这件物件的来历？</span>
    <span class="chip ghost">它和这座城市的关系？</span>
    <span class="chip ghost">还有哪些老物件？</span>
  </div>

  <div class="inputrow">
    <div class="field"><input id="q" placeholder="输入你的问题…" maxlength="60"></div>
    <button class="send" id="sendBtn" type="button">发送</button>
  </div>

  <div class="footbtns">
    <button class="btn ghost" id="collectBtn" type="button">☆ 收藏到图鉴</button>
    <a class="btn seal" id="cardBtn" href="08-card.html">生成纪念卡 →</a>
  </div>
</div>
<nav class="pager"><a href="04-grab.html">‹ 上一页</a><a href="index.html">总览</a><a href="06-collection.html">下一页：图鉴页 ›</a></nav>

<script src="js/ai-config.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
(function(){
  var user = requireLogin();

  /* ---------- 物件来源：URL > lastGrab > 默认 ---------- */
  var itemId = qsParam('item');
  if(!itemId || !ITEM_DATA[itemId]){
    var last = Store.get('lastGrab', null);
    itemId = (last && ITEM_DATA[last.item]) ? last.item : 'ticket87';
  }
  var item = ITEM_DATA[itemId];
  var city = CITY_DATA[item.city];

  document.title = item.name + ' · AI 记忆讲述人';
  document.getElementById('objThumb').textContent = item.emoji;
  document.getElementById('objThumb').style.background = 'hsl(' + item.hue + ',42%,90%)';
  document.getElementById('objName').textContent = item.name;
  document.getElementById('objMeta').textContent = item.en + ' · ' + item.era;
  document.getElementById('objCity').textContent = city.name;
  document.getElementById('cardBtn').href = '08-card.html?item=' + itemId;

  /* ---------- 故事打字机 ---------- */
  var storyEl = document.getElementById('storyText');
  function typeText(el, text, done){
    var i = 0;
    el.innerHTML = '<span class="caret"></span>';
    var timer = setInterval(function(){
      i += 2;
      el.innerHTML = escapeHtml(text.slice(0, i)) + '<span class="caret"></span>';
      if(i >= text.length){
        clearInterval(timer); el.textContent = text;
        if(done) done();
      }
    }, 34);
  }
  /* 知识库状态角标：已接 DeepSeek → 在线生成；未配置/失败 → 本地知识库 */
  function refreshAiChip(){
    var kb = document.getElementById('kbChip');
    if(!kb) return;
    if(AI.enabled()){ kb.textContent = 'DeepSeek 在线生成 · 知识库支撑'; }
    else{ kb.textContent = '知识库支撑 · 有据可查'; }
  }
  refreshAiChip();
  AI.story(itemId).then(function(text){
    typeText(storyEl, text, function(){
      addBubble('ai', '我是这座城市的老朋友。关于这件「' + item.name + '」，你想问点什么？');
    });
  });

  /* ---------- TTS 语音播放（浏览器内置语音合成） ---------- */
  var ttsBtn = document.getElementById('ttsBtn'), wave = document.getElementById('wave');
  var ttsLabel = document.getElementById('ttsLabel'), ttsState = document.getElementById('ttsState');
  function zhVoice(){
    var vs = speechSynthesis.getVoices();
    for(var i = 0; i < vs.length; i++) if(/zh|Chinese|中文/i.test(vs[i].lang + vs[i].name)) return vs[i];
    return vs[0] || null;
  }
  var speakTimer = null;
  function speak(text, onEnd){
    if(!('speechSynthesis' in window)){
      ttsState.textContent = '当前浏览器不支持语音'; return;
    }
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    var v = zhVoice(); if(v) u.voice = v;
    u.lang = 'zh-CN'; u.rate = .95; u.pitch = 1;
    u.onend = function(){ stopWave(); if(onEnd) onEnd(); };
    u.onerror = function(){ stopWave(); ttsState.textContent = '语音播放中断'; };
    speechSynthesis.speak(u);
    wave.classList.add('on'); ttsBtn.textContent = '⏸'; ttsBtn.classList.add('playing');
    ttsLabel.textContent = '正在朗读…';
    ttsState.textContent = '';
  }
  function stopWave(){
    wave.classList.remove('on'); ttsBtn.textContent = '▶'; ttsBtn.classList.remove('playing');
    ttsLabel.textContent = '播放语音（浏览器 TTS）';
  }
  ttsBtn.onclick = function(){
    if(!('speechSynthesis' in window)){ toast('当前浏览器不支持语音合成'); return; }
    if(speechSynthesis.speaking){ speechSynthesis.cancel(); stopWave(); }
    else speak(item.story);
  };
  if('speechSynthesis' in window){
    speechSynthesis.getVoices();
    speechSynthesis.onvoiceschanged = function(){ zhVoice(); };
  }

  /* ---------- 多轮对话（保留历史上下文，供真 AI 模型使用） ---------- */
  var chatEl = document.getElementById('chat');
  var llmHistory = [];   // [{role:'user'|'assistant', content}, ...] 最多带最近10条
  function addBubble(role, text, isHtml){
    var d = document.createElement('div');
    d.className = 'bub ' + role;
    if(isHtml) d.innerHTML = text; else d.textContent = text;
    chatEl.appendChild(d);
    chatEl.scrollTop = chatEl.scrollHeight;
    return d;
  }
  function ask(question){
    if(!question.trim()) return;
    addBubble('me', question);
    var t = addBubble('ai', '<i></i><i></i><i></i>', true);
    t.classList.add('typing');
    AI.reply(itemId, question, llmHistory).then(function(ans){
      t.classList.remove('typing');
      typeText(t, ans);
      llmHistory.push({ role: 'user', content: question });
      llmHistory.push({ role: 'assistant', content: ans });
      if(llmHistory.length > 10) llmHistory = llmHistory.slice(-10);
      chatEl.scrollTop = chatEl.scrollHeight;
    });
  }
  document.getElementById('sendBtn').onclick = function(){
    var inp = document.getElementById('q');
    ask(inp.value); inp.value = '';
  };
  document.getElementById('q').addEventListener('keydown', function(e){
    if(e.key === 'Enter') document.getElementById('sendBtn').click();
  });
  document.querySelectorAll('#quick .chip').forEach(function(c){
    c.onclick = function(){ ask(c.textContent); };
  });

  /* ---------- 收藏 ---------- */
  var collectBtn = document.getElementById('collectBtn');
  function refreshCollect(){
    if(Biz.isCollected(itemId)){
      collectBtn.textContent = '✓ 已在图鉴中';
      collectBtn.classList.remove('ghost'); collectBtn.classList.add('btn'); collectBtn.setAttribute('disabled','');
    }
  }
  collectBtn.onclick = function(){
    if(Biz.isCollected(itemId)) return;
    Biz.collect(itemId);
    Biz.addHistory(itemId);
    toast('已收藏进图鉴 📖');
    refreshCollect();
    /* 集齐解锁隐藏故事 */
    var unlockedAt = Biz.checkHidden(item.city);
    if(unlockedAt && Date.now() - unlockedAt < 60000){
      var h = CITY_DATA[item.city].hidden;
      openDialog({
        title: '🎉 集齐' + CITY_DATA[item.city].name + '四件！',
        html: '<p style="text-align:center;color:var(--gold);font-weight:700;margin-bottom:6px">' + h.title + '</p>' +
              '<p style="font-family:var(--serif);line-height:2.1">' + h.text + '</p>',
        okText: '去图鉴看看', hideCancel: false,
        onOk: function(){ setTimeout(function(){ location.href = '06-collection.html?city=' + item.city; }, 50); }
      });
    }
  };
  refreshCollect();
})();
</script>
</body>
</html>
