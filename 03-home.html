<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>首页 · 拾城记</title>
<link rel="stylesheet" href="css/style.css">
<style>
.stage{
  border:1.5px solid var(--ink-bd);border-radius:var(--r-lg);height:230px;position:relative;overflow:hidden;
  background:radial-gradient(340px 200px at 50% 108%, rgba(200,162,75,.30), transparent 65%),
             linear-gradient(180deg,#f4eddc, #e9dcc0);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
}
.orb{
  width:104px;height:104px;border-radius:50%;cursor:pointer;position:relative;
  background:radial-gradient(circle at 32% 30%, #fff6dc, #e8b64f 45%, var(--seal) 100%);
  box-shadow:0 0 34px rgba(200,162,75,.75), 0 0 70px rgba(181,64,44,.35), inset -8px -12px 22px rgba(120,40,20,.45);
  animation:floaty 3.2s ease-in-out infinite;
  display:flex;align-items:center;justify-content:center;font-size:40px;user-select:none;
}
.orb::after{content:"";position:absolute;inset:-12px;border-radius:50%;
  border:1.5px dashed rgba(181,64,44,.55);animation:spinSlow 12s linear infinite}
.stage .hint{font-size:12px;color:var(--ink-2);letter-spacing:1px}
.stage .ribbon{position:absolute;top:12px;left:14px;font-family:var(--serif);font-size:12px;color:var(--seal);letter-spacing:3px;opacity:.8}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.slot{
  border:1.5px solid var(--ink-bd);border-radius:var(--r-md);padding:6px 5px 7px;
  display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;
  text-decoration:none;color:var(--ink);transition:transform .15s;background:var(--card);
}
.slot:hover{transform:translateY(-2px)}
.slot .thumb{
  width:100%;height:58px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  border:1.5px solid var(--line);overflow:hidden;
}
.slot .thumb .pedestal{transform:scale(1.08)}
.slot .nm{font-size:10px;line-height:1.35;text-align:center;color:var(--ink-2);height:27px;overflow:hidden}
.slot.locked{border-style:dashed;border-color:var(--line);cursor:pointer;background:#fbf8f0}
.slot.locked:hover{background:#f6efdf}
.slot.locked .qmark{
  flex:1;display:flex;align-items:center;justify-content:center;
  min-height:90px;   /* 与「插画58+间距5+名字27」等高，保证整行全灰时格子高度一致 */
  font-size:40px;font-weight:700;color:#c9bfa9;line-height:1;
}
.closing-hint{
  text-align:center;font-size:12px;color:var(--ink-2);letter-spacing:1.5px;
  margin:6px 0 2px;display:flex;align-items:center;justify-content:center;gap:8px;
}
.closing-hint::before,.closing-hint::after{
  content:"";width:34px;height:1px;background:var(--line);flex:none;
}
.car-card{
  position:relative;flex:0 0 96px;display:flex;flex-direction:column;gap:5px;
  text-decoration:none;color:var(--ink);user-select:none;-webkit-user-drag:none;
}
.car-card .thumb{
  height:68px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  border:1.5px solid #4a4030;background:radial-gradient(75% 70% at 50% 42%, #35301f, #201b12 78%);overflow:hidden;
}
.car-card .thumb .pedestal{transform:scale(1.06)}
.car-card .nm{font-size:10.5px;line-height:1.3;height:27px;overflow:hidden;color:var(--ink)}
.car-card .meta{font-size:9px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.car-card .got{
  position:absolute;top:4px;right:4px;z-index:2;width:16px;height:16px;border-radius:50%;
  background:var(--seal);color:#fff8ef;font-size:10px;font-style:normal;font-weight:700;
  display:flex;align-items:center;justify-content:center;border:1.5px solid var(--card);
}
.carousel{overflow:hidden;cursor:grab;margin-top:2px;touch-action:pan-y}
.carousel.dragging{cursor:grabbing}
.car-track{display:flex;gap:10px;width:max-content;will-change:transform;padding:2px 0}
.citymenu{
  position:absolute;top:56px;right:20px;z-index:50;display:none;flex-direction:column;gap:6px;
  background:var(--card);border:1.5px solid var(--ink-bd);border-radius:var(--r-md);padding:8px;min-width:150px;
  box-shadow:var(--shadow);
}
.citymenu.show{display:flex}
.citymenu div{padding:8px 12px;border-radius:8px;font-size:13.5px;cursor:pointer}
.citymenu div:hover{background:#f4ecd9}
.citymenu div.on{color:var(--seal);font-weight:700}
.citymenu .hd{font-size:10.5px;color:var(--ink-3);cursor:default;padding-bottom:2px;letter-spacing:2px}
.userwrap{position:relative;display:flex;align-items:center;gap:10px;flex:1}
.progress-wrap{display:flex;align-items:center;gap:8px;margin-top:6px}
</style>
</head>
<body>
<div class="phone" id="phone">
  <div class="topbar">
    <div class="userwrap" id="userBox"></div>
    <span class="chip click" id="cityChip">— ▾</span>
  </div>

  <div class="citymenu" id="cityMenu"></div>

  <div class="stage">
    <span class="ribbon" id="cityRibbon">拾城记 · 石家庄</span>
    <div class="orb" id="orb" title="点我抓取">🎁</div>
    <div class="hint" id="stageHint">伸出手握个拳 · 拾起一段拾城记</div>
  </div>

  <a class="btn seal" href="04-grab.html" id="grabBtn">抓取一枚拾城记</a>

  <div id="relayLine" style="display:none;font-size:12px;color:var(--ink-2);text-align:center;margin-top:-8px">
    <svg class="ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="12" r="2.6"/><circle cx="17.5" cy="6" r="2.6"/><circle cx="17.5" cy="18" r="2.6"/><path d="M8.4 10.9l6.7-3.7M8.4 13.1l6.7 3.7"/></svg> 经由「<b id="relayName" style="color:var(--seal)"></b>」的链接来到这里 · 去抓一件回应 TA
  </div>

  <span style="font-size:13.5px;font-weight:700;font-family:var(--serif);letter-spacing:1px" id="gridTitle">我的图鉴</span>
  <div class="grid4" id="grid"></div>

  <span style="font-size:13.5px;font-weight:700;font-family:var(--serif);letter-spacing:1px" id="carTitle">全部图鉴</span>
  <div class="carousel" id="carousel"><div class="car-track" id="carTrack"></div></div>

  <div class="closing-hint" id="closingHint">光球里藏着一枚老物件 · 快来探索吧</div>

  <div class="tabbar"></div>
</div>

<script src="js/data.js"></script>
<script src="js/art.js"></script>
<script src="js/app.js"></script>
<script>
(function(){
  var user = requireLogin();
  renderTabbar('home');

  var cityId = Biz.city();
  if(!CITY_DATA[cityId]) cityId = 'shijiazhuang';

  function render(){
    var city = CITY_DATA[cityId];
    var collected = Biz.collected();
    var ids = city.items;
    var got = ids.filter(function(id){ return collected[id]; }).length;

    /* 用户区 */
    document.getElementById('userBox').innerHTML =
      avatarHtml(user, 40) +
      '<div style="flex:1;min-width:0">' +
        '<div style="font-weight:700;font-size:14.5px">' + escapeHtml(user.nick) + '</div>' +
        '<div class="progress-wrap"><div class="track" style="max-width:150px"><div class="fill" style="width:' + (got / ids.length * 100) + '%"></div></div>' +
        '<span style="font-size:11px;color:var(--ink-2)">' + got + '/' + ids.length + '</span></div>' +
      '</div>';

    /* 城市切换 + 定位入口（右上角 📍） */
    var chip = document.getElementById('cityChip');
    chip.innerHTML = locating ? ico('pin', 14) + ' 定位中…' : ico('pin', 14) + ' ' + city.name + ' ▾';
    chip.onclick = function(){ document.getElementById('cityMenu').classList.toggle('show'); };
    var menu = document.getElementById('cityMenu');
    menu.innerHTML = '<div class="hd">切换城市</div>' + Object.keys(CITY_DATA).map(function(id){
      var c = CITY_DATA[id];
      return '<div class="' + (id === cityId ? 'on' : '') + '" data-id="' + id + '">' +
        c.name + ' · ' + c.tagline + (id === cityId ? ' ✓' : '') + '</div>';
    }).join('') + '<div id="relocRow">📍 重新定位当前城市</div>';
    menu.querySelectorAll('div[data-id]').forEach(function(d){
      d.onclick = function(){
        cityId = d.dataset.id;
        Biz.setCity(cityId);
        document.getElementById('cityMenu').classList.remove('show');
        toast('已切换到「' + CITY_DATA[cityId].name + '」');
        render();
      };
    });
    var rr = menu.querySelector('#relocRow');
    rr.onclick = function(){
      document.getElementById('cityMenu').classList.remove('show');
      autoLocate(true);
    };

    document.getElementById('cityRibbon').textContent = '拾城记 · ' + city.name;
    var gotAll = got >= ids.length;
    document.getElementById('grabBtn').textContent = gotAll
      ? '盲盒已集齐 · 再抽一次碰碰运气' : '抓取一枚拾城记';
    document.getElementById('orb').innerHTML = ico(gotAll ? 'spark' : 'gift', 36, gotAll ? '#7a4a12' : '#fff8ef');
    document.getElementById('stageHint').textContent = gotAll
      ? '记忆已集齐 · 再拆一次碰碰运气'
      : '伸出手握个拳 · 拾起一段拾城记';

    /* 好友接力来源 */
    var relay = Store.get('relay', null);
    var relayLine = document.getElementById('relayLine');
    if(relay && relay.from){
      document.getElementById('relayName').textContent = relay.from;
      relayLine.style.display = 'block';
    }else relayLine.style.display = 'none';

    /* 我的图鉴格（当前城市 8 件，收藏点亮；插画+名字占满方框） */
    document.getElementById('grid').innerHTML = ids.map(function(id){
      var it = ITEM_DATA[id];
      if(collected[id]){
        var ah = itemArt(id, 58);
        return '<a class="slot" href="05-chat.html?item=' + id + '">' +
          '<div class="thumb" style="' + (ah ?
            'background:radial-gradient(75% 70% at 50% 42%, #35301f, #201b12 78%);border-color:#4a4030' :
            'background:hsl(' + it.hue + ',42%,90%)') + '">' + (ah || it.emoji) + '</div>' +
          '<div class="nm">' + it.name + '</div></a>';
      }
      return '<div class="slot locked"><span class="qmark">?</span></div>';
    }).join('');
    document.querySelectorAll('#grid .slot.locked').forEach(function(el){
      el.onclick = function(){
        openDialog({
          title: ico('lock', 15) + ' 还差 ' + (ids.length - got) + ' 件',
          html: '<p style="text-align:center;line-height:2">「' + city.name + '」的记忆碎片还未拼凑完整<br>抓一个盲盒试试运气</p>',
          okText: '去抓取',
          onOk: function(){ setTimeout(function(){ location.href = '04-grab.html'; }, 50); }
        });
      };
    });

    /* 底部邀约语（随收集进度变化） */
    var total = 0, gotTotal = 0;
    Object.keys(CITY_DATA).forEach(function(cid){
      total += CITY_DATA[cid].items.length;
      gotTotal += CITY_DATA[cid].items.filter(function(id){ return collected[id]; }).length;
    });
    document.getElementById('closingHint').textContent = gotTotal >= total
      ? '✦ 两城的记忆都被你收齐了 · 太厉害了'
      : (gotTotal === 0 ? '光球里藏着一枚老物件 · 快来探索吧'
                        : '光球里还藏着 ' + (total - gotTotal) + ' 枚老物件 · 快来探索吧');
  }

  /* ---------- 定位（首页内完成） ---------- */
  var locating = false;
  function distKm(lat1, lng1, lat2, lng2){
    var r = Math.PI / 180;
    var a = Math.sin((lat2 - lat1) * r / 2), b = Math.sin((lng2 - lng1) * r / 2);
    var h = a * a + Math.cos(lat1 * r) * Math.cos(lat2 * r) * b * b;
    return 2 * 6371 * Math.asin(Math.sqrt(h));
  }
  function autoLocate(manual){
    if(locating) return;
    var chip = document.getElementById('cityChip');
    if(!navigator.geolocation){
      toast('浏览器不支持定位，请在右上角手动选择城市'); return;
    }
    locating = true;
    chip.textContent = '📍 定位中…';
    toast(manual ? '正在重新定位…' : '正在定位你所在的城市…', 1600);
    navigator.geolocation.getCurrentPosition(function(pos){
      locating = false;
      var la = pos.coords.latitude, ln = pos.coords.longitude;
      var best = null, bd = 1e9;
      Object.keys(CITY_DATA).forEach(function(id){
        var d = distKm(la, ln, CITY_DATA[id].lat, CITY_DATA[id].lng);
        if(d < bd){ bd = d; best = id; }
      });
      if(bd <= 150){
        cityId = best; Biz.setCity(best);
        toast('已定位到「' + CITY_DATA[best].name + '」✓');
      }else{
        toast('距已开通城市较远，请在右上角手动选择', 2800);
      }
      render();
    }, function(){
      locating = false;
      render();
      toast('定位失败，点右上角「📍」手动选择城市', 2800);
    }, { enableHighAccuracy: true, timeout: 9000 });
  }

  document.getElementById('orb').onclick = function(){ location.href = '04-grab.html'; };
  document.addEventListener('click', function(e){
    var menu = document.getElementById('cityMenu');
    if(menu.classList.contains('show') && !menu.contains(e.target) && !e.target.closest('#cityChip')){
      menu.classList.remove('show');
    }
  });

  /* 好友接力提示 */
  var relay = qsParam('relay');
  if(relay){
    Store.set('relay', { from: relay, ts: Date.now() });
    setTimeout(function(){ toast('🎉 好友「' + relay + '」邀请你接力抓取！', 3200); }, 300);
  }

  render();

  /* ---------- 全部图鉴轮播：两城混排 + 自动播放 + 鼠标拖拽 ---------- */
  (function(){
    var items = [];
    Object.keys(CITY_DATA).forEach(function(cid){
      CITY_DATA[cid].items.forEach(function(iid){ items.push(iid); });
    });
    /* 洗牌混排（不按城市分组，每次进页随机） */
    for(var i = items.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = items[i]; items[i] = items[j]; items[j] = t;
    }
    var got = Biz.collected();
    var box = document.getElementById('carousel'), track = document.getElementById('carTrack');
    track.innerHTML = items.concat(items).map(function(id){
      var it = ITEM_DATA[id], ct = CITY_DATA[it.city];
      return '<a class="car-card" href="05-chat.html?item=' + id + '" draggable="false">' +
        (got[id] ? '<i class="got">✓</i>' : '') +
        '<div class="thumb">' + (itemArt(id, 64) || it.emoji) + '</div>' +
        '<div class="nm">' + it.name + '</div>' +
        '<span class="meta">' + ct.name + '</span></a>';
    }).join('');

    var half = 0, offset = 0, dragging = false, hover = false, lastX = 0, moved = 0, lastT = 0;
    function measure(){
      var n = items.length;
      if(track.children.length >= 2 * n && track.children[n]){
        half = track.children[n].offsetLeft - track.children[0].offsetLeft;
      }
    }
    measure();
    window.addEventListener('resize', measure);
    function wrap(){
      if(half > 0){
        while(offset >= half) offset -= half;
        while(offset < 0) offset += half;
      }
    }
    function paint(){ track.style.transform = 'translateX(' + (-offset) + 'px)'; }

    box.addEventListener('mouseenter', function(){ hover = true; });
    box.addEventListener('mouseleave', function(){ hover = false; });
    box.addEventListener('pointerdown', function(e){
      dragging = true; moved = 0; lastX = e.clientX;
      box.classList.add('dragging');
      if(box.setPointerCapture) box.setPointerCapture(e.pointerId);
    });
    box.addEventListener('pointermove', function(e){
      if(!dragging) return;
      var dx = e.clientX - lastX;
      lastX = e.clientX;
      moved += Math.abs(dx);
      offset -= dx;
      wrap();
      paint();
    });
    function endDrag(){
      if(!dragging) return;
      dragging = false;
      box.classList.remove('dragging');
    }
    box.addEventListener('pointerup', endDrag);
    box.addEventListener('pointercancel', endDrag);
    /* 拖拽超过 8px 视为滑动，不触发卡片跳转 */
    box.addEventListener('click', function(e){
      if(moved > 8){ e.preventDefault(); e.stopPropagation(); }
    }, true);

    /* rAF 驱动；页面切回时按 1 秒上限计算位移，避免后台恢复后突然跳动 */
    function loop(now){
      var dt = lastT ? Math.min(1000, now - lastT) / 1000 : 0;
      lastT = now;
      if(!dragging && !hover && dt > 0){
        offset += 26 * dt;
        wrap();
        paint();
      }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  })();

  /* 登录后首次进入首页：自动定位所在城市 */
  if(!Store.get('city', null)) autoLocate();
})();
</script>
</body>
</html>
