<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 拾城记</title>
<link rel="stylesheet" href="css/style.css">
<style>
.emblem{display:flex;justify-content:center;margin-top:8px;filter:drop-shadow(0 10px 18px rgba(42,37,29,.28))}
.emblem svg{display:block}
.tabs{display:flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden}
.tabs button{flex:1;border:none;background:transparent;padding:10px 0;font-size:14px;
  font-family:inherit;color:var(--ink-2);cursor:pointer;letter-spacing:2px}
.tabs button.on{background:var(--ink);color:var(--card);font-weight:600}
.err-tip{font-size:12px;color:var(--seal);min-height:16px;text-align:center}
</style>
</head>
<body>
<div class="page-tag"><b>01</b>&nbsp;登录页 · LOGIN</div>
<div class="phone">
  <div class="emblem">
    <svg viewBox="0 0 132 132" width="128" height="128" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="拾城记">
      <defs>
        <linearGradient id="lg_ink" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#38312a"/>
          <stop offset="1" stop-color="#191510"/>
        </linearGradient>
        <radialGradient id="lg_glow" cx=".5" cy=".55" r=".55">
          <stop offset="0" stop-color="#e8b64f" stop-opacity=".4"/>
          <stop offset="1" stop-color="#e8b64f" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <!-- 印章式外框 -->
      <rect x="5" y="5" width="122" height="122" rx="26" fill="url(#lg_ink)" stroke="#c8a24b" stroke-width="2"/>
      <rect x="12.5" y="12.5" width="107" height="107" rx="20" fill="none" stroke="#c8a24b" stroke-width="1" opacity=".5"/>
      <!-- 城市升起的光晕 -->
      <ellipse cx="66" cy="58" rx="42" ry="32" fill="url(#lg_glow)"/>
      <!-- 从盒中升起的城市天际线 -->
      <g fill="#e8b64f">
        <rect x="46" y="46" width="9" height="26" rx="1.5"/>
        <rect x="58" y="34" width="11" height="38" rx="1.5"/>
        <rect x="72" y="42" width="9" height="30" rx="1.5"/>
        <rect x="84" y="50" width="8" height="22" rx="1.5"/>
      </g>
      <g fill="#14110b">
        <rect x="48.5" y="50" width="2.6" height="2.6"/>
        <rect x="60.5" y="40" width="2.6" height="2.6"/>
        <rect x="64" y="50" width="2.6" height="2.6"/>
        <rect x="60.5" y="58" width="2.6" height="2.6"/>
        <rect x="74.5" y="48" width="2.6" height="2.6"/>
        <rect x="86" y="56" width="2.6" height="2.6"/>
      </g>
      <path d="M63.5 34 V27 M61.5 28.5 h4" stroke="#e8b64f" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M101 32 l1.1 2.7 2.7 1.1 -2.7 1.1 -1.1 2.7 -1.1 -2.7 -2.7 -1.1 2.7 -1.1 z" fill="#c8a24b"/>
      <circle cx="30" cy="44" r="1.8" fill="#c8a24b" opacity=".8"/>
      <!-- 盒身（开口向上） -->
      <rect x="42" y="78" width="48" height="28" rx="5" fill="#12100b" stroke="#e8b64f" stroke-width="2.4"/>
      <path d="M42 89 h48 M66 78 v28" stroke="#e8b64f" stroke-width="2"/>
      <!-- 盒口金光缝 -->
      <rect x="45" y="74.5" width="42" height="3.6" rx="1.8" fill="#e8b64f" opacity=".95"/>
      <!-- 掀起的盒盖 -->
      <g transform="rotate(-13 45 79)">
        <rect x="40" y="66" width="48" height="11" rx="3" fill="#12100b" stroke="#e8b64f" stroke-width="2.4"/>
      </g>
      <!-- 朱砂蝴蝶结 -->
      <path d="M66 93 c -5 -3.4 -10 -4.2 -10 -1.4 0 2.4 5 3.4 10 1.4 z" fill="#b5402c"/>
      <path d="M66 93 c 5 -3.4 10 -4.2 10 -1.4 0 2.4 -5 3.4 -10 1.4 z" fill="#b5402c"/>
      <circle cx="66" cy="93" r="1.8" fill="#e8b64f"/>
      <!-- 地平点线 -->
      <path d="M26 115 H106" stroke="#c8a24b" stroke-width="1.6" opacity=".55" stroke-dasharray="1 6" stroke-linecap="round"/>
    </svg>
  </div>

  <div class="tabs">
    <button id="tabLogin" class="on" type="button">登 录</button>
    <button id="tabReg" type="button">注 册</button>
  </div>

  <div class="field"><span><svg class="ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M10.5 17.5h3"/></svg></span><input id="phone" maxlength="11" placeholder="手机号（11位数字）"></div>
  <div class="field" id="nickRow" style="display:none"><span><svg class="ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5.5 20c1.2-3.4 3.6-5 6.5-5s5.3 1.6 6.5 5"/></svg></span><input id="nick" maxlength="12" placeholder="昵称（可不填，默认用手机尾号）"></div>
  <div class="field"><span><svg class="ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5.5" y="10.5" width="13" height="9.5" rx="2"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg></span><input id="pwd" type="password" placeholder="密码（至少6位）"></div>
  <div class="field" id="pwd2Row" style="display:none"><span><svg class="ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5.5" y="10.5" width="13" height="9.5" rx="2"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg></span><input id="pwd2" type="password" placeholder="确认密码"></div>
  <div class="err-tip" id="err"></div>

  <button class="btn solid" id="submitBtn" type="button">登&nbsp;&nbsp;录</button>

  <div class="divider">其他登录方式</div>
  <button class="btn" id="wxBtn" type="button"><svg width="19" height="17" viewBox="0 0 28 24" aria-hidden="true"><path fill="#09BB07" d="M11 3C6 3 2 6.4 2 10.6c0 2.4 1.3 4.5 3.4 5.9L4.6 19.6l3.4-1.7c.9.3 1.9.4 3 .4h.4A6.7 6.7 0 0 1 11 15c0-3.5 3.4-6.3 7.5-6.3h.5C18.2 5 14.9 3 11 3z"/><path fill="#09BB07" d="M26 15.2c0-3.1-3-5.6-6.7-5.6s-6.7 2.5-6.7 5.6 3 5.6 6.7 5.6c.9 0 1.7-.1 2.5-.4l2.9 1.5-.8-2.9c1.3-1 2.1-2.4 2.1-3.8z"/><circle cx="8.6" cy="9" r="1" fill="#fff"/><circle cx="13" cy="9" r="1" fill="#fff"/><circle cx="17.6" cy="14.6" r=".9" fill="#fff"/><circle cx="21" cy="14.6" r=".9" fill="#fff"/></svg>&nbsp;&nbsp;微信一键登录（模拟）</button>

</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
(function(){
  var mode = 'login';
  var $ = function(id){ return document.getElementById(id); };

  /* 已登录则直接进首页 */
  if(Session.current()){
    toast('已登录，正在进入首页…', 1200);
    setTimeout(function(){ location.href = '03-home.html'; }, 700);
    return;
  }

  function setMode(m){
    mode = m;
    $('tabLogin').className = m === 'login' ? 'on' : '';
    $('tabReg').className = m === 'reg' ? 'on' : '';
    $('nickRow').style.display = m === 'reg' ? '' : 'none';
    $('pwd2Row').style.display = m === 'reg' ? '' : 'none';
    $('submitBtn').textContent = m === 'login' ? '登  录' : '注 册 并 登 录';
    $('err').textContent = '';
  }
  $('tabLogin').onclick = function(){ setMode('login'); };
  $('tabReg').onclick = function(){ setMode('reg'); };

  function err(msg){
    $('err').textContent = msg;
    document.querySelectorAll('.field input').forEach(function(inp){
      inp.parentElement.classList.remove('err');
    });
  }
  function randHue(){ return Math.floor(Math.random() * 360); }

  function doWxLogin(){
    var u = Session.current();
    if(!u){
      var id = 'wx_' + Math.random().toString(36).slice(2, 8);
      u = { id: id, phone: id, nick: '微信用户' + id.slice(3).toUpperCase(), hue: randHue(), isWx: true };
      Session.login(u);
    }
    toast('微信登录成功（模拟）');
    setTimeout(function(){ location.href = '03-home.html'; }, 500);
  }
  $('wxBtn').onclick = doWxLogin;

  $('submitBtn').onclick = function(){
    var phone = $('phone').value.trim();
    var pwd = $('pwd').value;
    if(!/^1\d{10}$/.test(phone)) return err('请输入 11 位手机号');
    if(pwd.length < 6) return err('密码至少 6 位');

    var users = Store.get('users', {});
    if(mode === 'reg'){
      if(users[phone]) return err('该手机号已注册，请直接登录');
      if($('pwd2').value !== pwd) return err('两次输入的密码不一致');
      var nick = $('nick').value.trim() || ('街坊' + phone.slice(-4));
      users[phone] = { pwd: pwd, nick: nick, hue: randHue(), createdAt: Date.now() };
      Store.set('users', users);
      Session.login({ id: phone, phone: phone, nick: nick, hue: users[phone].hue, isWx: false });
      toast('注册成功，欢迎来到拾城记');
      setTimeout(function(){ location.href = '03-home.html'; }, 600);
    }else{
      var u = users[phone];
      if(!u || u.pwd !== pwd) return err('账号或密码不正确（未注册？请先注册）');
      Session.login({ id: phone, phone: phone, nick: u.nick, hue: u.hue, avatar: u.avatar || null, isWx: false });
      toast('登录成功，欢迎回来，' + u.nick);
      setTimeout(function(){ location.href = '03-home.html'; }, 600);
    }
  };
  $('pwd').addEventListener('keydown', function(e){ if(e.key === 'Enter') $('submitBtn').click(); });
})();
</script>
</body>
</html>
